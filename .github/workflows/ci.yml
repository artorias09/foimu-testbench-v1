name: FO-IMU CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        gate: [core, gui]
        include:
          - {os: ubuntu-latest, gate: mutants}
          - {os: ubuntu-latest, gate: properties}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Python runtime
        run: python -c "import platform,sys; print(platform.platform()); print(sys.version)"
      - run: python -m pip install -r requirements.txt
      - if: matrix.gate == 'gui'
        run: python -m pip install -r requirements-gui.txt
      - if: runner.os == 'Linux' && matrix.gate == 'gui'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m tools.ci_gate ${{ matrix.gate }} --out logs/ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gate }}-${{ matrix.os }}-${{ github.sha }}
          path: logs/ci
          if-no-files-found: warn
