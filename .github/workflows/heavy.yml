name: FO-IMU acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-gui.txt
      # P3 invokes P2, which invokes legacy acceptance, including the million-frame gate.
      - run: python -m tools.acceptance_p3 --out logs/heavy
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-${{ github.sha }}
          path: |
            logs/heavy/**/*.json
            logs/heavy/**/*.log
            logs/heavy/**/*.txt
